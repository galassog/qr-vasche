<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <title>Scheda vasca</title>
    <meta name="robots" content="noindex">
    <script>
        const params = new URLSearchParams(window.location.search);
        const target = new URL('https://gestione-vasche.web.app/');
        const id = params.get('id');
        if (id) {
            target.searchParams.set('view', 'vasca');
            target.searchParams.set('id', id);
            target.searchParams.set('cantina', 'sanlorenzo');
        }
        window.location.replace(target.toString());
    </script>
</head>
<body>
    <p>Apertura della scheda vasca… <a id="vai" href="https://gestione-vasche.web.app/">Continua</a></p>
    <script>
        document.getElementById('vai').href = new URL(window.location.href).search
            ? ('https://gestione-vasche.web.app/?view=vasca&id=' + encodeURIComponent(new URLSearchParams(window.location.search).get('id') || '') + '&cantina=sanlorenzo')
            : 'https://gestione-vasche.web.app/';
    </script>
</body>
</html>
